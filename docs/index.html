<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f7f0e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c140e" media="(prefers-color-scheme: dark)">
<title>Turkey Hunt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦃%3C/text%3E%3C/svg%3E">

<!--
  WHERE THE HUNT'S SETTINGS LIVE.

  On the main site a small service (src/worker.js) holds them and this page
  asks it every 15 seconds. The hiding spot is only handed over while the
  compass is live.

  On the fallback site there is no service, so this page re-reads the
  settings file, config.json, every 30 seconds instead.

  Either way a change reaches every phone without anyone reloading. The
  settings:

    target       where the turkey is hidden: either { "lat": ..., "lon": ... }
                 or the scrambled text the organizer page saves.
                 null means "no spot yet": the compass waits.
    start, end   when the hunt runs. The -05:00 means New York time in November.
    everyMinutes, liveSeconds
                 the compass wakes for liveSeconds at the top of every
                 everyMinutes, counted from the start.
    direction    "general" snaps the turkey to the nearest of 8 directions;
                 "exact" points straight at the spot.
    alwaysOn     true keeps the compass on from now until the end (the endgame).
    testMode     true shows the organizer box. Set to false for the real hunt.
-->

<style>
:root {
  --bg:#f7f0e3; --card:#fffaf0; --ink:#2b1d12; --muted:#75604b; --line:#e2d3ba;
  --accent:#b3401f; --accent-ink:#ffffff; --warn-bg:#fff1c9; --warn-ink:#5c4300;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#1c140e; --card:#281d14; --ink:#f5ead8; --muted:#b9a58c; --line:#3d2d1f;
    --accent:#ef7446; --accent-ink:#1c140e; --warn-bg:#3d3212; --warn-ink:#f3dc9a;
  }
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size:16px; line-height:1.45;
}
main { max-width:460px; margin:0 auto; padding:20px 16px calc(28px + env(safe-area-inset-bottom)); }
h1 { font-family:Georgia, "Times New Roman", serif; font-weight:800; font-size:30px; line-height:1.1; margin:4px 0 4px; }
p { margin:0; }
.when { color:var(--muted); font-weight:600; }

.card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px 16px; margin-top:14px; }
.compass { text-align:center; }
.headline { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.count { font-size:46px; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums; margin-top:2px; }
.count:empty { display:none; }
.countLabel { color:var(--muted); }
body[data-state="live"] .headline, body[data-state="live"] .count,
body[data-stirring="1"] .headline, body[data-stirring="1"] .count { color:var(--accent); }

.dial { position:relative; width:min(300px, 78vw); aspect-ratio:1; margin:16px auto 12px; }
.dialsvg { position:absolute; inset:0; width:100%; height:100%; }
.rose { transition:opacity .4s; }
.rose .ring { fill:none; stroke:var(--ink); stroke-width:2; }
.rose .ring.faint { stroke:var(--line); stroke-width:1.5; }
.rose line { stroke:var(--muted); stroke-width:1.5; stroke-linecap:round; }
.rose text { fill:var(--muted); font-family:-apple-system, "Segoe UI", Roboto, sans-serif; font-weight:700; font-size:17px; text-anchor:middle; dominant-baseline:central; }
.rose text.n { fill:var(--accent); font-size:21px; }
body[data-asleep="1"] .rose { opacity:.35; }
body[data-stirring="1"] .rose { opacity:.7; }

.needle, .bird { opacity:0; transition:opacity .3s; pointer-events:none; }
body[data-needle="1"] .needle, body[data-needle="1"] .bird { opacity:1; }
.needle line { stroke:var(--accent); stroke-width:5; stroke-linecap:round; }
.needle path { fill:var(--accent); }
.needle path.wedge { opacity:.2; }
body[data-direction="exact"] .needle path.wedge { display:none; }
/* The turkey is moved around the dial but never rotated, so it stays sharp. */
.bird { position:absolute; left:50%; top:50%; font-size:clamp(38px, 12.5vw, 50px); line-height:1; will-change:transform; }

.hub { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
.hub .dot { grid-area:1/1; width:14px; height:14px; border-radius:50%; background:var(--ink); }
.hub .icon { grid-area:1/1; font-size:58px; line-height:1; }
body[data-asleep="1"] .hub .dot { display:none; }

.dir { font-size:19px; font-weight:700; }
.dir:empty, .diag:empty, .how:empty { display:none; }
.diag { color:var(--muted); font-size:14px; margin-top:10px; }

.btn {
  display:block; width:100%; padding:14px 16px; border-radius:14px; border:2px solid var(--ink);
  background:transparent; color:var(--ink); font-family:inherit; font-weight:700; font-size:17px;
  line-height:1.2; text-align:center; text-decoration:none; cursor:pointer;
}
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); margin-top:12px; }

.how { color:var(--muted); font-size:14px; margin-top:16px; text-align:center; }
#times { font-weight:600; }

.inapp { background:var(--card); border:2px solid var(--accent); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
.inapp strong { display:block; margin-bottom:4px; }
.inapp .row { display:grid; gap:8px; margin-top:10px; }
.inapp .btn { padding:11px 12px; font-size:16px; margin-top:0; }

.setup { background:var(--warn-bg); color:var(--warn-ink); border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:14px; }
.setup strong { display:block; margin-bottom:4px; }
.setup ul { margin:0; padding-left:18px; }
.setup ul + strong { margin-top:12px; }
.setup .try { display:grid; gap:8px; }
.setup input[type="number"] { width:4.2em; font:inherit; font-size:16px; padding:4px 6px; border:1px solid currentColor; border-radius:8px; background:transparent; color:inherit; text-align:center; }
.setup select, .setup button { font:inherit; font-size:16px; font-weight:600; padding:9px 10px; border:1px solid currentColor; border-radius:10px; background:transparent; color:inherit; width:100%; text-align:center; cursor:pointer; }
.setup p:empty { display:none; }
</style>
</head>

<body data-state="loading" data-asleep="1">
<main>
  <div id="inapp" class="inapp" hidden></div>
  <div id="setup" class="setup" hidden></div>

  <header>
    <h1 id="name">The Turkey Hunt</h1>
    <p id="when" class="when"></p>
  </header>

  <section class="card compass" aria-label="Compass">
    <p id="headline" class="headline" aria-live="polite"></p>
    <p id="count" class="count"></p>
    <p id="countLabel" class="countLabel"></p>

    <div id="dial" class="dial" aria-hidden="true">
      <svg class="dialsvg" viewBox="0 0 300 300">
        <g id="rose" class="rose"></g>
        <g id="needle" class="needle">
          <path class="wedge" d="M150 150 L105.2 41.9 A117 117 0 0 1 194.8 41.9 Z"></path>
          <line x1="150" y1="150" x2="150" y2="118"></line>
          <path d="M150 94 L138 120 L162 120 Z"></path>
        </g>
      </svg>
      <span id="bird" class="bird">🦃</span>
      <div class="hub"><span class="dot"></span><span id="hubIcon" class="icon"></span></div>
    </div>

    <p id="dir" class="dir"></p>
    <button id="enable" class="btn primary" type="button" hidden></button>
    <p id="diag" class="diag"></p>
  </section>

  <p id="times" class="how"></p>
  <p id="how" class="how"></p>
</main>

<script>
(() => {
  "use strict";
  // Phones only share location and the compass over https, so never stay on plain http.
  if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    location.replace("https://" + location.host + location.pathname + location.search);
    return;
  }
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const ua = navigator.userAgent || "";
  const PLACEHOLDER = { lat: 40.73082, lon: -73.99733 };   // Washington Square Arch
  const DEFAULTS = {
    name: "The Turkey Hunt", target: null, start: null, end: null,
    everyMinutes: 30, liveSeconds: 30, headsUpSeconds: 120,
    direction: "general", alwaysOn: false,
    declination: -12.5,   // phone compasses read magnetic north; this corrects to true north for New York City
    pointer: "🦃", testMode: false,
  };
  const WARMUP = 45000;   // GPS starts this long before a window so the fix is ready when it opens
  const POLL = 30000;     // how often the page re-reads config.json

  /* ---------- settings ---------- */
  let cfg = Object.assign({}, DEFAULTS), cfgText = null, cfgLoadedAt = 0, ready = false, TEST = false;
  let START = NaN, END = NaN, CYCLE = 1800000, LIVE = 30000, HEADSUP = 120000, mode = "general";
  let target = null;      // the spot, when this phone has been given it
  let hasSpot = false;    // whether a spot exists at all (the service only sends it while the compass is live)
  let source = null;      // "api" = the instant service, "file" = config.json on the fallback site
  let serverOffset = 0;   // with the service, every phone runs on the server's clock

  // The organizer page saves the spot scrambled, so it can't be read at a
  // glance in the settings file. This is a deterrent, not a lock.
  const SCRAMBLE = "gobble-gobble-2026";
  function unscramble(str) {
    try {
      const raw = atob(String(str).slice(3));
      let out = "";
      for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ SCRAMBLE.charCodeAt(i % SCRAMBLE.length));
      return JSON.parse(out);
    } catch (e) { return null; }
  }

  function applyConfig(raw) {
    cfg = Object.assign({}, DEFAULTS, raw);
    START = Date.parse(cfg.start);
    END = Date.parse(cfg.end);
    CYCLE = Math.max(1, parseFloat(cfg.everyMinutes) || 30) * 60000;
    LIVE = Math.max(5, parseFloat(cfg.liveSeconds) || 30) * 1000;
    HEADSUP = Math.max(0, parseFloat(cfg.headsUpSeconds) || 0) * 1000;
    mode = cfg.direction === "exact" ? "exact" : "general";
    const tg = typeof cfg.target === "string" ? unscramble(cfg.target) : cfg.target;
    const lat = tg ? parseFloat(tg.lat) : NaN, lon = tg ? parseFloat(tg.lon) : NaN;
    target = isFinite(lat) && isFinite(lon) ? { lat, lon } : null;
    hasSpot = "hasSpot" in raw ? !!raw.hasSpot : !!target;
    document.title = cfg.name;
    $("name").textContent = cfg.name;
    $("bird").textContent = cfg.pointer;
    setHow();
    fillChecklist($("checklist"));
  }

  // Where the settings come from. On the main site a small service answers at
  // api/state: changes arrive within seconds, and the hiding spot is only sent
  // while the compass is live. The fallback site has no such service, so there
  // the page reads the settings file (config.json) instead.
  async function fetchSettings() {
    if (source !== "file") {
      try {
        const res = await fetch(`api/state?t=${Date.now()}`, { cache: "no-store" });
        const state = res.ok ? await res.json().catch(() => null) : null;
        if (state && typeof state.now === "number") {
          source = "api";
          serverOffset = state.now - Date.now();
          delete state.now;
          return state;
        }
      } catch (e) { /* no connection, or no service here */ }
      if (source === "api") return null;   // the service exists; keep what we have and ask again shortly
    }
    // No answer from a service. If this site has a settings file, it is the
    // fallback site. (The main site deliberately does not serve one.)
    const res = await fetch(`config.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const settings = await res.json();
    source = "file";
    return settings;
  }
  let nudgedAt = 0;
  const nudge = () => { if (Date.now() - nudgedAt > 2000) { nudgedAt = Date.now(); loadConfig(); } };

  // Read the settings. A change is applied on the spot; the page never needs a reload.
  async function loadConfig() {
    try {
      const parsed = await fetchSettings();
      if (!parsed) return false;
      const text = JSON.stringify(parsed);
      cfgLoadedAt = Date.now();
      if (text !== cfgText) {
        const first = cfgText === null;
        cfgText = text;
        try { localStorage.setItem("turkey-config", text); } catch (e) {}
        if (ready && !!parsed.testMode !== TEST) { location.reload(); return; }   // the organizer box appears or goes away
        applyConfig(parsed);
        if (!first) render();
      }
      return true;
    } catch (e) { return false; }
  }

  /* ---------- test-mode overrides (ignored when testMode is false) ---------- */
  let clockOffset = null, fakePos = null, fakeHeading = null;
  function readOverrides() {
    if (!TEST) return;
    const n = Date.parse(qs.get("now") || "");
    if (!isNaN(n)) clockOffset = n - Date.now();
    const p = (qs.get("pos") || "").split(",").map(Number);
    if (p.length === 2 && p.every(isFinite)) fakePos = { lat: p[0], lon: p[1], acc: 10, t: Infinity };
    const h = parseFloat(qs.get("heading"));
    if (isFinite(h)) fakeHeading = ((h % 360) + 360) % 360;
    if (qs.get("inapp")) inApp = qs.get("inapp");   // ?inapp=Instagram shows the prompt
  }
  const now = () => Date.now() + (clockOffset !== null ? clockOffset : serverOffset);

  /* ---------- in-app browsers (a link tapped inside Instagram and similar) ---------- */
  const inAppHit = /Instagram|FBAN|FBAV|FB_IAB|Barcelona|Snapchat|TikTok|musical_ly|Bytedance|LinkedInApp/i.exec(ua);
  let inApp = !inAppHit ? null : /Instagram/i.test(inAppHit[0]) ? "Instagram" : /^FB/i.test(inAppHit[0]) ? "Facebook" : "this app";
  // Laptops and desktops have no compass sensor at all.
  const looksDesktop = !(navigator.maxTouchPoints > 0) && !/Android|iPhone|iPad|iPod/i.test(ua);

  /* ---------- schedule ---------- */
  function phase(t) {
    if (!(START < END)) return { state: "unset", until: null };
    if (t < START) return { state: "before", until: START };
    if (t >= END) return { state: "over", until: null };
    if (!hasSpot) return { state: "nospot", until: null };
    if (cfg.alwaysOn) return { state: "live", until: END, always: true };
    const into = (t - START) % CYCLE;
    if (into < LIVE) return { state: "live", until: Math.min(t - into + LIVE, END) };
    const next = t - into + CYCLE;
    return { state: "dark", until: next < END ? next : null };
  }

  /* ---------- formatting ---------- */
  const fmtClock = ms => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const fmtDay = ms => new Date(ms).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  function fmtLeft(ms) {
    let s = Math.max(0, Math.ceil(ms / 1000));
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const pad = n => String(n).padStart(2, "0");
    if (d) return `${d}d ${h}h ${pad(m)}m`;
    if (h) return `${h}:${pad(m)}:${pad(s)}`;
    return `${m}:${pad(s)}`;
  }
  const liveText = () => LIVE < 120000 ? `${Math.round(LIVE / 1000)} seconds` : `${Math.round(LIVE / 60000)} minutes`;

  /* ---------- geometry ---------- */
  const rad = d => d * Math.PI / 180;
  const deg = r => r * 180 / Math.PI;
  function bearingTo(a, b) {
    const p1 = rad(a.lat), p2 = rad(b.lat), dl = rad(b.lon - a.lon);
    const y = Math.sin(dl) * Math.cos(p2);
    const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
    return (deg(Math.atan2(y, x)) + 360) % 360;
  }
  const WORDS = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
  const shortest = (from, to) => ((to - from + 540) % 360) - 180;

  /* ---------- sensors ---------- */
  let sensorsOn = false, sensorsSince = 0;
  let pos = null;            // { lat, lon, acc, t }
  let heading = null;        // degrees clockwise from true north
  let geoWatch = null, geoStartedAt = 0, geoError = null, compassDenied = false;
  let wake = null, wakePending = false;
  let permResult = "not asked", evCount = 0, evWebkit = 0, evAbs = 0;   // for the organizer's debug line

  function onOrient(e) {
    evCount++;
    if (typeof e.webkitCompassHeading === "number") evWebkit++;
    if (e.absolute) evAbs++;
    let h = null;
    if (typeof e.webkitCompassHeading === "number" && !isNaN(e.webkitCompassHeading)) h = e.webkitCompassHeading; // iPhone
    else if (e.absolute && typeof e.alpha === "number") h = 360 - e.alpha;                                       // Android
    if (h === null) return;
    const screenAngle = (screen.orientation && typeof screen.orientation.angle === "number")
      ? screen.orientation.angle : (window.orientation || 0);
    heading = (h + screenAngle + (parseFloat(cfg.declination) || 0) + 720) % 360;   // the drawing loop does the smoothing
  }

  function startGeo() {
    if (geoWatch !== null) return;
    if (!navigator.geolocation) { geoError = "unsupported"; return; }
    geoStartedAt = Date.now();
    geoWatch = navigator.geolocation.watchPosition(
      g => { pos = { lat: g.coords.latitude, lon: g.coords.longitude, acc: g.coords.accuracy, t: Date.now() }; geoError = null; render(); },
      err => { if (err.code === 1) { geoError = "denied"; stopGeo(); render(); } },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  }
  function stopGeo() {
    if (geoWatch !== null) { navigator.geolocation.clearWatch(geoWatch); geoWatch = null; }
  }

  async function keepAwake(on) {
    try {
      if (on && !wake && !wakePending && "wakeLock" in navigator && document.visibilityState === "visible") {
        wakePending = true;
        wake = await navigator.wakeLock.request("screen");
        wake.addEventListener("release", () => { wake = null; });
      } else if (!on && wake) {
        const w = wake; wake = null; await w.release();
      }
    } catch (e) { wake = null; }
    wakePending = false;
  }
  const buzz = () => { try { if (sensorsOn && navigator.vibrate) navigator.vibrate(200); } catch (e) {} };

  async function enable() {
    sensorsOn = true; sensorsSince = Date.now();
    if (fakeHeading !== null) {
      heading = fakeHeading;
    } else {
      try { // iPhone only hands over the compass when asked from a tap
        if (typeof DeviceOrientationEvent === "undefined") permResult = "no motion support in this browser";
        else if (typeof DeviceOrientationEvent.requestPermission === "function") {
          permResult = await DeviceOrientationEvent.requestPermission();
          if (permResult !== "granted") compassDenied = true;
        } else permResult = "not needed";
      } catch (e) { compassDenied = true; permResult = "refused (" + (e && e.name || "error") + ")"; }
      // Listen either way: a real reading always wins over a "denied" answer.
      window.addEventListener("deviceorientationabsolute", onOrient, true);
      window.addEventListener("deviceorientation", onOrient, true);
    }
    if (fakePos) pos = fakePos;
    render();
  }

  /* ---------- drawing ---------- */
  // The dial is redrawn on every animation frame, easing toward the latest
  // sensor reading. Nothing here uses CSS transitions: on phones they lag
  // behind a fast-changing compass and blur whatever is turning.
  let shownHeading = 0, shownBearing = null, lastFrame = 0, dialSize = 0;
  const ease = (shown, to, dt, tau) => (shown + shortest(shown, to) * (1 - Math.exp(-dt / tau)) + 360) % 360;
  function frame(ts) {
    const dt = Math.min(100, ts - (lastFrame || ts));
    lastFrame = ts;
    const h = heading === null ? 0 : heading;   // no compass: north is the top of the dial
    shownHeading = ease(shownHeading, h, dt, 90);
    $("rose").setAttribute("transform", `rotate(${(-shownHeading).toFixed(2)} 150 150)`);
    if (document.body.dataset.needle === "1" && pos && target) {
      let b = bearingTo(pos, target);
      if (mode === "general") b = (Math.round(b / 45) * 45) % 360;   // snap to 8 points
      shownBearing = shownBearing === null ? b : ease(shownBearing, b, dt, 150);
      const a = (shownBearing - shownHeading + 360) % 360;
      $("needle").setAttribute("transform", `rotate(${a.toFixed(2)} 150 150)`);
      // Slide the turkey to its place on the dial, on whole screen pixels, without turning it.
      const r = dialSize * 88 / 300, dpr = window.devicePixelRatio || 1;
      const px = v => Math.round(v * dpr) / dpr;
      $("bird").style.transform = `translate(${px(r * Math.sin(rad(a)))}px, ${px(-r * Math.cos(rad(a)))}px) translate(-50%, -50%)`;
    } else shownBearing = null;
    requestAnimationFrame(frame);
  }

  let lastState = null, lastStirring = false, lastAwake = false;
  function render() {
    if (!ready) {
      $("headline").textContent = "Loading the hunt";
      $("countLabel").textContent = cfgLoadedAt === -1 ? "Can't reach the hunt settings. Check your signal; this page keeps trying." : "";
      return;
    }
    const t = now(), p = phase(t), state = p.state;
    document.body.dataset.state = state;
    document.body.dataset.direction = mode;
    document.body.dataset.asleep = (state === "live" || state === "before") ? "0" : "1";

    // "soon" is the warm-up before a window: GPS starts and the screen stays
    // on, so a short window isn't spent waiting for a fix.
    const toWindow = state === "dark" && p.until !== null ? p.until - t : state === "before" ? START - t : Infinity;
    const soon = toWindow < WARMUP;
    // The heads-up: a coming-soon stage on screen before each window.
    const stirring = state === "dark" && toWindow < HEADSUP;
    document.body.dataset.stirring = stirring ? "1" : "0";
    if (lastState !== null && ((state === "live" && lastState !== "live") || (stirring && !lastStirring))) buzz();
    lastState = state; lastStirring = stirring;

    const wantAwake = sensorsOn && (state === "live" || soon);
    if (wantAwake !== lastAwake) { lastAwake = wantAwake; keepAwake(wantAwake); }

    // GPS only runs when it is needed: during a window, the warm-up before
    // one, and once before the start so people can check their phone.
    const wantGeo = sensorsOn && !fakePos && geoError !== "denied" && geoError !== "unsupported" &&
      (state === "live" || soon || (state === "before" && !pos));
    if (wantGeo) startGeo(); else stopGeo();
    // A fix only counts if it came from the current GPS session, not the last window.
    const fresh = !!pos && (pos.t === Infinity || (geoWatch !== null && pos.t >= geoStartedAt));

    $("when").textContent =
      state === "unset" ? "Time to be announced" :
      state === "before" ? `Starts ${fmtDay(START)} at ${fmtClock(START)}` :
      state === "over" ? `Ended ${fmtDay(END)} at ${fmtClock(END)}` :
      `On now, until ${fmtClock(END)}`;

    let headline = "", count = "", label = "", dir = "", hub = "";
    const getReady = `Get your compass ready now. The window only lasts ${liveText()}.`;
    if (state === "unset") {
      headline = "The hunt isn't scheduled yet";
      label = "The start time will show up here on its own.";
      hub = cfg.pointer;
    } else if (state === "before") {
      headline = "The hunt starts in";
      count = fmtLeft(START - t);
      label = sensorsOn ? "" : "Check your phone now so you're ready at the start.";
      if (sensorsOn && pos && heading !== null) dir = "You're set. The red N is north.";
    } else if (state === "nospot") {
      headline = "The turkey is on the loose";
      label = "It hasn't picked a hiding spot yet. The compass wakes up once it does.";
      hub = "🏃";
      if (!sensorsOn) dir = "Get your compass ready now so you don't miss the first window.";
    } else if (state === "live" && p.always) {
      headline = "The compass is on";
      label = `It stays on until ${fmtClock(END)}. Go get the turkey.`;
    } else if (state === "live") {
      headline = "The compass is live";
      count = fmtLeft(p.until - t);
      label = "until it goes dark";
    } else if (state === "dark") {
      headline = stirring ? "The turkey is stirring" : "The turkey is hiding";
      hub = stirring ? "👀" : "💤";
      if (p.until) {
        count = fmtLeft(p.until - t);
        label = stirring ? `until the compass wakes for ${liveText()}. Get ready.` : `until the compass is back at ${fmtClock(p.until)}`;
      } else label = "No more compass windows today.";
      if (!sensorsOn && p.until) dir = getReady;
    } else {
      headline = "The hunt is over";
      label = "Thanks for playing.";
      hub = cfg.pointer;
    }

    // The service hands over the spot just before each window; ask as soon as it is due.
    if (source === "api" && hasSpot && !target && (soon || state === "live")) nudge();

    let showNeedle = false;
    if (state === "live" && sensorsOn) {
      if (geoError === "denied") dir = "Location is blocked for this page. Allow it in your browser settings, then reload.";
      else if (geoError === "unsupported") dir = "This browser can't share location. Open the link in Safari or Chrome.";
      else if (!target) dir = "Finding the turkey…";
      else if (!fresh) dir = "Finding you…";
      else {
        showNeedle = true;
        dir = `The turkey is ${WORDS[Math.round(bearingTo(pos, target) / 45) % 8]} of you.`;
      }
    }
    document.body.dataset.needle = showNeedle ? "1" : "0";

    $("headline").textContent = headline;
    $("count").textContent = count;
    $("countLabel").textContent = label;
    $("dir").textContent = dir;
    $("hubIcon").textContent = hub;

    const btn = $("enable");
    btn.hidden = sensorsOn || state === "over" || state === "unset";
    btn.textContent = state === "before" ? "Check my compass" : state === "live" ? "Turn on the compass" : "Get the compass ready";

    let diag = "";
    if (sensorsOn && state !== "over" && state !== "unset") {
      const waited = Date.now() - sensorsSince > 3000;
      const c = heading !== null ? (state === "live" || state === "before" ? "Compass working." : "Compass ready for the next window.")
        : looksDesktop && waited ? "This looks like a computer, which has no compass, so north is the top of the dial. Open the link on a phone for the real thing."
        : compassDenied ? "Compass blocked. Close this tab and reopen the link to be asked again. Until then, north is the top of the dial."
        : waited ? "No compass signal on this device, so north is the top of the dial. If you're inside another app, open the link in Safari or Chrome."
        : "Waiting for the compass…";
      let g = "";
      if (state === "before" || state === "live") {
        g = geoError === "denied" ? " Location blocked."
          : geoError === "unsupported" ? " No location in this browser."
          : pos ? ` GPS within ${Math.round(pos.acc)} m.${pos.acc > 100 ? " That's fuzzy. Step into the open." : ""}`
          : " Waiting for GPS…";
      }
      diag = c + g;
    }
    $("diag").textContent = diag;

    // Organizer-only: what this phone reported, and when the settings were last read.
    if (TEST && $("debug")) {
      $("loaded").textContent = `Settings last read at ${new Date(cfgLoadedAt).toLocaleTimeString()}, from ${source === "api" ? "the instant service (every 15 seconds)" : "the settings file (every 30 seconds)"}.`;
      $("debug").textContent = !sensorsOn ? "" :
        `Compass debug: permission ${permResult}; ${evCount} motion events, ${evWebkit} with an iPhone heading, ${evAbs} marked absolute; ` +
        `${looksDesktop ? "looks like a computer" : "looks like a phone"}${inApp ? `, inside ${inApp}` : ""}.`;
    }

    // The "open in Safari or Chrome" prompt goes away once the compass and GPS both work here.
    if (inApp) $("inapp").hidden = heading !== null && !!pos;

    // The next few compass times, so people can set a timer.
    const times = [];
    if ((state === "before" || state === "dark" || state === "nospot" || (state === "live" && !p.always)) && !cfg.alwaysOn) {
      for (let w = t < START ? START : START + Math.ceil((t - START + 1) / CYCLE) * CYCLE; w < END && times.length < 6; w += CYCLE) times.push(fmtClock(w));
    }
    $("times").textContent = times.length ? `Compass wakes at ${times.join(" · ")}` : "";
  }

  /* ---------- one-time setup ---------- */
  function buildRose() {
    const NS = "http://www.w3.org/2000/svg";
    const el = (tag, attrs, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (text) e.textContent = text;
      return e;
    };
    const rose = $("rose");
    rose.appendChild(el("circle", { cx: 150, cy: 150, r: 147, class: "ring" }));
    rose.appendChild(el("circle", { cx: 150, cy: 150, r: 119, class: "ring faint" }));
    for (let a = 0; a < 360; a += 10) {
      if (a % 90 === 0) continue;
      rose.appendChild(el("line", { x1: 150, y1: 4, x2: 150, y2: a % 30 === 0 ? 13 : 9, transform: `rotate(${a} 150 150)` }));
    }
    ["N", "E", "S", "W"].forEach((letter, i) => {
      rose.appendChild(el("text", { x: 150, y: 19, class: letter === "N" ? "n" : "", transform: `rotate(${i * 90} 150 150)` }, letter));
    });
  }

  // Shown when the page is opened inside another app's built-in browser,
  // where phones often refuse to hand over the compass or location.
  function buildInApp() {
    if (!inApp) return;
    const pageUrl = location.origin + location.pathname;
    const who = inApp === "this app" ? "this app's" : `${inApp}'s`;
    const add = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };

    const open = add("button", "Open in my browser", "btn primary");
    open.type = "button";
    open.addEventListener("click", () => {
      if (/iPhone|iPad|iPod/i.test(ua)) location.href = "x-safari-" + pageUrl;                       // iPhone: hand the link to Safari
      else if (/Android/i.test(ua)) location.href = `intent://${pageUrl.replace(/^https?:\/\//, "")}#Intent;scheme=https;end`;  // Android: default browser
      else window.open(pageUrl, "_blank");
    });

    const copy = add("button", "Copy the link", "btn");
    copy.type = "button";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(pageUrl); copy.textContent = "Copied. Paste it in Safari or Chrome."; }
      catch (e) { copy.textContent = "Couldn't copy. Use the ⋯ menu instead."; }
    });

    const row = add("div", "", "row");
    row.append(open, copy);
    const box = $("inapp");
    box.append(
      add("strong", "Open this page in Safari or Chrome"),
      add("p", `You're in ${who} built-in browser, where the compass often can't start. Tap the ⋯ menu at the top of the screen and choose "Open in external browser", or use the buttons below.`),
      row);
    box.hidden = false;
  }

  function setHow() {
    $("how").textContent = (cfg.alwaysOn
      ? "The compass stays on until the hunt ends. "
      : `The compass wakes for ${liveText()} every ${Math.round(CYCLE / 60000)} minutes. Set a timer so you don't miss it. `) +
      "Your location never leaves your phone.";
  }

  // The organizer checklist is refilled whenever the settings change.
  function fillChecklist(ul, testTurkey) {
    if (!ul) return;
    ul.textContent = "";
    const item = text => { const li = document.createElement("li"); li.textContent = text; ul.appendChild(li); };
    if (!(START < END)) item("The start and end times aren't set.");
    if (testTurkey) item("A test turkey is hidden near you, on this phone only.");
    else if (!hasSpot) item("No hiding spot is set yet.");
    else if (target && target.lat === PLACEHOLDER.lat && target.lon === PLACEHOLDER.lon) item("The hiding spot is still a placeholder (Washington Square Arch).");
    if (cfg.alwaysOn) item("The compass is set to always on.");
    item("Test mode is on, so players see this box too. It goes away when testMode is false in the settings.");
  }

  // The organizer box: what is still a placeholder, plus controls for trying
  // things out on this phone only. Shown while testMode is true in config.json.
  function buildSetup() {
    if (!TEST) return;
    const box = $("setup");
    const add = (tag, text) => { const e = document.createElement(tag); if (text) e.textContent = text; return e; };

    const ul = add("ul");
    ul.id = "checklist";
    fillChecklist(ul);

    const num = (value, min, max, apply) => {
      const i = add("input");
      i.type = "number"; i.inputMode = "numeric"; i.min = min; i.max = max; i.value = value;
      i.addEventListener("input", () => {
        const v = parseFloat(i.value);
        if (isFinite(v) && v >= min && v <= max) { apply(v); setHow(); render(); }
      });
      return i;
    };
    const timing = add("p");
    timing.append("Compass live for ", num(LIVE / 1000, 5, 900, v => { LIVE = v * 1000; }),
      " seconds every ", num(CYCLE / 60000, 1, 180, v => { CYCLE = v * 60000; }), " minutes");

    const sel = add("select");
    sel.setAttribute("aria-label", "Direction style");
    [["general", "General direction (8 points)"], ["exact", "Exact direction"]].forEach(([value, text]) => {
      const o = add("option", text); o.value = value; sel.appendChild(o);
    });
    sel.value = mode;
    sel.addEventListener("change", () => { mode = sel.value; render(); });

    const note = add("p");
    const jump = add("button", "Jump to 15 seconds before the next window");
    jump.type = "button";
    jump.addEventListener("click", () => {
      if (!(START < END)) { note.textContent = "Set the start and end times first."; return; }
      const t = now();
      let next = t < START ? START : START + Math.ceil((t - START + 1) / CYCLE) * CYCLE;
      if (next >= END) next = START;
      clockOffset = next - 15000 - Date.now();
      note.textContent = `Clock moved to 15 seconds before the ${fmtClock(next)} window.`;
      render();
    });

    const near = add("button", "Hide a test turkey near me");
    near.type = "button";
    near.addEventListener("click", async () => {
      if (!sensorsOn) await enable();
      const place = here => {
        const d = 250 + Math.random() * 250, th = Math.random() * 2 * Math.PI;
        target = {
          lat: here.lat + d * Math.cos(th) / 111320,
          lon: here.lon + d * Math.sin(th) / (111320 * Math.cos(rad(here.lat))),
        };
        hasSpot = true;
        fillChecklist($("checklist"), true);
        note.textContent = `Test turkey hidden about ${Math.round(d / 10) * 10} m from where you are standing, on this phone only. Jump to the next window and go find it.`;
        render();
      };
      if (fakePos) return place(fakePos);
      if (!navigator.geolocation) { note.textContent = "No location in this browser."; return; }
      note.textContent = "Finding you…";
      navigator.geolocation.getCurrentPosition(
        g => place({ lat: g.coords.latitude, lon: g.coords.longitude }),
        () => { note.textContent = "Couldn't get your location."; },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 });
    });

    const loaded = add("p"); loaded.id = "loaded";
    const debug = add("p"); debug.id = "debug";
    const tryBox = add("div");
    tryBox.className = "try";
    tryBox.append(timing, sel, jump, near, note, loaded, debug,
      add("p", "These controls only change this phone, and a change to the real settings overrides them."));
    box.append(add("strong", "Organizer checklist"), ul, add("strong", "Try it out"), tryBox);
    box.hidden = false;
  }

  /* ---------- start ---------- */
  const measure = () => { dialSize = $("dial").clientWidth; };
  async function boot() {
    buildRose();
    measure();
    window.addEventListener("resize", measure);
    requestAnimationFrame(frame);
    render();

    // First read of the settings; fall back to the last copy this phone saw.
    while (!(await loadConfig())) {
      try {
        const cached = localStorage.getItem("turkey-config");
        if (cached) { applyConfig(JSON.parse(cached)); cfgText = cached; cfgLoadedAt = Date.now(); break; }
      } catch (e) {}
      cfgLoadedAt = -1;   // tells render() to show the "can't reach" line
      render();
      await new Promise(r => setTimeout(r, 5000));
    }
    TEST = !!cfg.testMode;
    readOverrides();
    ready = true;
    buildInApp();
    buildSetup();
    $("enable").addEventListener("click", enable);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (lastAwake) keepAwake(true);
        loadConfig();
        render();
      }
    });
    render();
    setInterval(render, 500);
    const again = async () => { await loadConfig(); setTimeout(again, source === "api" ? 15000 : POLL); };
    setTimeout(again, source === "api" ? 15000 : POLL);
  }
  boot();
})();
</script>
</body>
</html>
